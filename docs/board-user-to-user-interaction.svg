<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
  <title id="title">Board User-to-User Interaction Flow</title>
  <desc id="desc">Product interaction diagram showing how one user's board actions affect another user's UI through presence, realtime updates, activity, comments, assignments, watchers, and notifications.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.4; }
      .lane { fill: #fbfcfe; stroke: #e2e7ef; stroke-width: 1; }
      .actor { fill: #111827; }
      .actorText { fill: #ffffff; font: 700 20px Arial, sans-serif; }
      .title { fill: #111827; font: 700 34px Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #5b6472; font: 16px Arial, sans-serif; }
      .sectionTitle { fill: #1f2937; font: 700 15px Arial, sans-serif; letter-spacing: .08em; }
      .box { fill: #ffffff; stroke: #cfd7e3; stroke-width: 1.3; rx: 10; }
      .boxBlue { fill: #eef6ff; stroke: #8fc5ff; stroke-width: 1.4; rx: 10; }
      .boxGreen { fill: #eefaf3; stroke: #91d7a8; stroke-width: 1.4; rx: 10; }
      .boxAmber { fill: #fff7e8; stroke: #f0bd67; stroke-width: 1.4; rx: 10; }
      .boxPurple { fill: #f5f1ff; stroke: #b9a4f3; stroke-width: 1.4; rx: 10; }
      .boxRed { fill: #fff1f1; stroke: #f0a3a3; stroke-width: 1.4; rx: 10; }
      .boxText { fill: #1f2937; font: 700 15px Arial, sans-serif; }
      .boxSmall { fill: #4b5563; font: 13px Arial, sans-serif; }
      .note { fill: #6b7280; font: 12px Arial, sans-serif; }
      .laneLabel { fill: #111827; font: 700 14px Arial, sans-serif; }
      .arrow { stroke: #374151; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .arrowLight { stroke: #6b7280; stroke-width: 1.7; fill: none; marker-end: url(#arrowLight); }
      .arrowDashed { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowLight); }
      .divider { stroke: #d8dee8; stroke-width: 1; stroke-dasharray: 5 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151" />
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1220" />
  <text class="title" x="64" y="68">Board Page: User-to-User Interaction Flow</text>
  <text class="subtitle" x="64" y="98">How User A's actions become visible to User B through board UI, realtime sync, activity, comments, assignments, presence, watchers, and notifications.</text>

  <rect class="panel" x="50" y="130" width="1580" height="1020" rx="18" />

  <rect class="actor" x="92" y="160" width="240" height="58" rx="14" />
  <text class="actorText" x="161" y="196">USER A</text>
  <text class="subtitle" x="99" y="241">Actor making a change</text>

  <rect class="actor" x="720" y="160" width="240" height="58" rx="14" />
  <text class="actorText" x="759" y="196">SHARED BOARD</text>
  <text class="subtitle" x="692" y="241">Server actions, DB triggers, realtime</text>

  <rect class="actor" x="1348" y="160" width="240" height="58" rx="14" />
  <text class="actorText" x="1417" y="196">USER B</text>
  <text class="subtitle" x="1340" y="241">Collaborator receiving the effect</text>

  <line class="divider" x1="390" y1="145" x2="390" y2="1130" />
  <line class="divider" x1="1290" y1="145" x2="1290" y2="1130" />

  <!-- Lane 1: Presence -->
  <rect class="lane" x="75" y="285" width="1530" height="135" rx="14" />
  <text class="laneLabel" x="100" y="315">1. Presence: knowing who is here and where they are</text>

  <rect class="boxBlue" x="110" y="335" width="250" height="58" />
  <text class="boxText" x="130" y="359">Opens board or card</text>
  <text class="boxSmall" x="130" y="378">location = board/card</text>

  <rect class="boxBlue" x="690" y="330" width="300" height="68" />
  <text class="boxText" x="715" y="356">Presence channel</text>
  <text class="boxSmall" x="715" y="376">board:{id}:presence</text>

  <rect class="boxGreen" x="1320" y="335" width="250" height="58" />
  <text class="boxText" x="1340" y="359">Sees live avatars</text>
  <text class="boxSmall" x="1340" y="378">"viewing board/card"</text>

  <path class="arrow" d="M360 364 C475 364, 555 364, 690 364" />
  <path class="arrow" d="M990 364 C1120 364, 1190 364, 1320 364" />

  <!-- Lane 2: Board data changes -->
  <rect class="lane" x="75" y="455" width="1530" height="175" rx="14" />
  <text class="laneLabel" x="100" y="485">2. Shared board changes: move, rename, complete, archive, labels, due dates</text>

  <rect class="boxBlue" x="110" y="515" width="250" height="68" />
  <text class="boxText" x="130" y="541">Changes a card/list</text>
  <text class="boxSmall" x="130" y="561">drag, inline edit, modal action</text>

  <rect class="boxAmber" x="455" y="515" width="250" height="68" />
  <text class="boxText" x="475" y="541">User A UI updates</text>
  <text class="boxSmall" x="475" y="561">optimistic local store</text>

  <rect class="boxAmber" x="765" y="505" width="250" height="88" />
  <text class="boxText" x="785" y="531">Server Action saves</text>
  <text class="boxSmall" x="785" y="551">validated DB write</text>
  <text class="boxSmall" x="785" y="570">activity/notification triggers</text>

  <rect class="boxGreen" x="1040" y="515" width="240" height="68" />
  <text class="boxText" x="1060" y="541">Realtime board event</text>
  <text class="boxSmall" x="1060" y="561">cards, lists, labels, members...</text>

  <rect class="boxGreen" x="1320" y="515" width="250" height="68" />
  <text class="boxText" x="1340" y="541">User B board updates</text>
  <text class="boxSmall" x="1340" y="561">same card/list state appears</text>

  <path class="arrow" d="M360 549 L455 549" />
  <path class="arrow" d="M705 549 L765 549" />
  <path class="arrow" d="M1015 549 L1040 549" />
  <path class="arrow" d="M1280 549 L1320 549" />
  <path class="arrow" d="M1160 583 C1160 610, 1430 610, 1430 583" />
  <path class="arrowDashed" d="M765 595 C690 628, 535 628, 460 585" />
  <text class="note" x="510" y="615">on failure: toast + retry + refresh</text>

  <!-- Lane 3: Comments and mentions -->
  <rect class="lane" x="75" y="665" width="1530" height="185" rx="14" />
  <text class="laneLabel" x="100" y="695">3. Comments, replies, and @mentions: direct collaboration inside a card</text>

  <rect class="boxBlue" x="110" y="730" width="250" height="68" />
  <text class="boxText" x="130" y="756">Writes comment/reply</text>
  <text class="boxSmall" x="130" y="776">@mention can target User B</text>

  <rect class="boxAmber" x="455" y="720" width="250" height="88" />
  <text class="boxText" x="475" y="746">Comment saved</text>
  <text class="boxSmall" x="475" y="766">author auto-watches</text>
  <text class="boxSmall" x="475" y="785">mentioned users auto-watch</text>

  <rect class="boxPurple" x="765" y="720" width="250" height="88" />
  <text class="boxText" x="785" y="746">DB fan-out</text>
  <text class="boxSmall" x="785" y="766">comment activity row</text>
  <text class="boxSmall" x="785" y="785">mention/watcher notifications</text>

  <rect class="boxGreen" x="1040" y="720" width="240" height="88" />
  <text class="boxText" x="1060" y="746">Realtime delivers</text>
  <text class="boxSmall" x="1060" y="766">comment appears in card</text>
  <text class="boxSmall" x="1060" y="785">bell pulses for recipient</text>

  <rect class="boxGreen" x="1320" y="720" width="250" height="88" />
  <text class="boxText" x="1340" y="746">User B reacts</text>
  <text class="boxSmall" x="1340" y="766">opens card, replies, resolves</text>
  <text class="boxSmall" x="1340" y="785">can mark notification read</text>

  <path class="arrow" d="M360 764 L455 764" />
  <path class="arrow" d="M705 764 L765 764" />
  <path class="arrow" d="M1015 764 L1040 764" />
  <path class="arrow" d="M1280 764 L1320 764" />
  <path class="arrow" d="M1160 808 C1160 834, 1445 834, 1445 808" />

  <!-- Lane 4: Assignments and watchers -->
  <rect class="lane" x="75" y="885" width="1530" height="130" rx="14" />
  <text class="laneLabel" x="100" y="915">4. Assignments and watchers: making work owned and followable</text>

  <rect class="boxBlue" x="110" y="940" width="250" height="50" />
  <text class="boxText" x="130" y="970">Assigns User B to card</text>

  <rect class="boxAmber" x="455" y="930" width="250" height="70" />
  <text class="boxText" x="475" y="956">card_members changes</text>
  <text class="boxSmall" x="475" y="976">assignee auto-watches</text>

  <rect class="boxPurple" x="765" y="930" width="250" height="70" />
  <text class="boxText" x="785" y="956">Activity + notification</text>
  <text class="boxSmall" x="785" y="976">assigned/unassigned events</text>

  <rect class="boxGreen" x="1040" y="930" width="240" height="70" />
  <text class="boxText" x="1060" y="956">Realtime membership</text>
  <text class="boxSmall" x="1060" y="976">avatar/assignee state updates</text>

  <rect class="boxGreen" x="1320" y="930" width="250" height="70" />
  <text class="boxText" x="1340" y="956">User B sees ownership</text>
  <text class="boxSmall" x="1340" y="976">card assigned + inbox item</text>

  <path class="arrow" d="M360 965 L455 965" />
  <path class="arrow" d="M705 965 L765 965" />
  <path class="arrow" d="M1015 965 L1040 965" />
  <path class="arrow" d="M1280 965 L1320 965" />
  <path class="arrow" d="M1160 1000 C1160 1018, 1445 1018, 1445 1000" />

  <!-- Lane 5: Activity feed -->
  <rect class="lane" x="75" y="1045" width="1530" height="75" rx="14" />
  <text class="laneLabel" x="100" y="1075">5. Activity feed: shared audit trail for both users</text>
  <rect class="boxRed" x="455" y="1086" width="250" height="28" />
  <text class="boxSmall" x="475" y="1105">Any tracked board action</text>
  <rect class="boxRed" x="765" y="1086" width="250" height="28" />
  <text class="boxSmall" x="785" y="1105">activity table INSERT</text>
  <rect class="boxRed" x="1040" y="1086" width="240" height="28" />
  <text class="boxSmall" x="1060" y="1105">activity sync refreshes feed</text>
  <rect class="boxRed" x="1320" y="1086" width="250" height="28" />
  <text class="boxSmall" x="1340" y="1105">User B sees who did what</text>
  <path class="arrowLight" d="M705 1100 L765 1100" />
  <path class="arrowLight" d="M1015 1100 L1040 1100" />
  <path class="arrowLight" d="M1280 1100 L1320 1100" />

  <!-- Footer rules -->
  <text class="note" x="78" y="1182">Important boundary: User A never pushes directly into User B's browser. User A writes through server actions and database triggers; Supabase Realtime, presence, and notification subscriptions update User B's UI according to access rules.</text>
</svg>
