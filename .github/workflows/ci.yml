name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci:lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - name: Capture env
        run: |
          {
            supabase status -o env | sed -E \
              -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' \
              -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' \
              -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              -e 's/^DB_URL=/DATABASE_URL=/'
          } > .env.local
      - run: npm run ci:unit
      - if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tune Supabase auth for CI
        run: |
          sed -i '/^\[auth\.email\]/,/^\[/ s/^enable_confirmations = false$/enable_confirmations = true/' supabase/config.toml
          sed -i '/^\[auth\.rate_limit\]/,/^\[/ s/^email_sent = .*/email_sent = 2000/' supabase/config.toml
          grep -E "^enable_confirmations|^email_sent" supabase/config.toml
      - run: supabase start
      - name: Capture env
        run: |
          {
            supabase status -o env | sed -E \
              -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' \
              -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' \
              -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              -e 's/^DB_URL=/DATABASE_URL=/'
          } > .env.local
      - run: npm run ci:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - if: always()
        run: supabase stop --no-backup
